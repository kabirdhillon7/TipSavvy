name: Fast PR Build

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Resolve Packages
        run: xcodebuild -resolvePackageDependencies -project Tippy.xcodeproj -scheme Tippy

      - name: Build and Unit Test
        run: |
          xcodebuild test \
            -project Tippy.xcodeproj \
            -scheme Tippy \
            -testPlan Tippy \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:TippyTests \
            CODE_SIGNING_ALLOWED=NO
