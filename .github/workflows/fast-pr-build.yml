name: Fast PR Build

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Packages
        run: xcodebuild -resolvePackageDependencies -project TipSavvy.xcodeproj -scheme TipSavvy

      - name: Build and Unit Test
        run: |
          xcodebuild test \
            -project TipSavvy.xcodeproj \
            -scheme TipSavvy \
            -testPlan TipSavvy \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:TipSavvyTests \
            CODE_SIGNING_ALLOWED=NO
