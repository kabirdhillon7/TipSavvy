    <rect x="934" y="470" width="128" height="20" rx="10" fill="#2F8F4E" fill-opacity="0.26"/>
    <rect x="626" y="522" width="256" height="20" rx="10" fill="#1B1B1B" fill-opacity="0.14"/>
